{% extends 'base.html' %}

{% block title %}Login - ECC Araguaína{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-4 mt-5">
        <div class="card shadow">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-heart text-primary" style="font-size: 3rem;"></i>
                    <h2 class="mt-2 fw-bold" style="color: var(--ecc-blue);">ECC Araguaína</h2>
                    <p class="text-muted">Acesse sua conta</p>
                </div>

                {% if form.errors %}
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-circle me-2"></i>
                    Usuário ou senha incorretos.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold">Usuário</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold">Senha</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-sign-in-alt me-2"></i>Entrar
                        </button>
                    </div>
                    {% if next %}
                    <input type="hidden" name="next" value="{{ next }}">
                    {% endif %}
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
