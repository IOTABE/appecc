<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ECC Araguaína - {% block title %}{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome for icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --ecc-blue: #0A3D62;
            --ecc-gold: #F6B93B;
            --ecc-light: #F8F9FA;
        }
        body {
            background-color: var(--ecc-light);
            font-family: 'Inter', sans-serif;
        }
        .navbar-custom {
            background-color: var(--ecc-blue);
        }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link {
            color: #ffffff;
        }
        .card-custom {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
        }
        .card-custom:hover {
            transform: translateY(-5px);
        }
        .circulo-amarelo { border-left: 5px solid #F6E58D; }
        .circulo-azul { border-left: 5px solid #7ED6DF; }
        .circulo-verde { border-left: 5px solid #BADC58; }
        .circulo-vermelho { border-left: 5px solid #FF7979; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-custom mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'home' %}"><i class="fas fa-cross me-2"></i>ECC Araguaína</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'home' %}"><i class="fas fa-chart-pie me-1"></i>Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'ficha' %}"><i class="fas fa-file-alt me-1"></i>Minha Ficha</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'balancete' %}"><i class="fas fa-file-invoice-dollar me-1"></i>Balancete</a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link"><i class="fas fa-user-circle me-1"></i>{{ user.username }}</span>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'admin:index' %}"><i class="fas fa-sign-in-alt me-1"></i>Login</a>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<div class="container pb-5">
    {% block content %}
    {% endblock %}
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.css"></script>
</body>
</html>
